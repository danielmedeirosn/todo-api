name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Menor privilégio: o token do workflow só lê o repositório
permissions:
  contents: read

jobs:
  test:
    name: Lint e testes
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: todo
          MYSQL_USER: todo
          MYSQL_PASSWORD: todo
          MYSQL_ROOT_PASSWORD: rootci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          DB_HOST: 127.0.0.1

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # histórico completo: segredos apagados ainda contam
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Semgrep
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - run: semgrep scan --config p/javascript --config p/nodejs --config p/secrets --error

  sca:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  dockerfile:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  image-scan:
    name: Build e Trivy
    runs-on: ubuntu-latest
    needs: [test, secrets, sast, sca, dockerfile]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: todo-api:ci
      - uses: aquasecurity/trivy-action@v0.35.0   # fixe por SHA, veja o alerta abaixo
        with:
          image-ref: todo-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

  publish:
    name: Publicar e assinar
    runs-on: ubuntu-latest
    needs: [image-scan]
    if: github.event_name == 'push'   # nunca publica a partir de PR
    permissions:
      contents: read
      id-token: write   # token OIDC para a assinatura keyless do Cosign
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/todo-api
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}-${{ github.sha }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3
      - name: Assinar a imagem pelo digest
        run: cosign sign --yes docker.io/${{ vars.DOCKERHUB_USERNAME }}/todo-api@${{ steps.build.outputs.digest }}
